<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>littleBraynBookSite - Digital Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <span class="brand-badge"><i class="fas fa-book-open"></i></span>
          <span>littleBrayn</span>
        </a>
        <nav class="nav">
          <a href="#hero">Home</a>
          <a href="#featured">Featured</a>
          <a href="#new-releases">New Releases</a>
        </nav>
        <form class="search" id="search-form" onsubmit="const q=document.getElementById('search-input').value.trim(); if(q){doSearch(q);} event.preventDefault(); return false;">
          <input id="search-input" placeholder="Search title, author, genre..." />
          <button type="submit"><i class="fas fa-search"></i></button>
        </form>
        <span class="header-actions">
          <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <i class="fas fa-moon" id="theme-icon"></i>
          </button>
          <span style="position:relative;display:inline-flex;align-items:center">
            <button id="category-menu-btn" class="icon-btn" title="Categories">
              <i class="fas fa-bars"></i>
            </button>
            <div id="category-menu" style="display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:230px;max-width:calc(100vw - 24px);max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface-raised,#fff);border:1px solid var(--border,#e6e9f4);border-radius:14px;box-shadow:0 22px 50px rgba(18,25,45,0.18);z-index:1001">
              <div id="category-menu-list"></div>
            </div>
          </span>
        </span>
      </div>
    </header>

    <main>
      <section id="landing-page" class="page active">
        <section class="hero">
          <div class="container hero-inner">
          <div class="hero-copy">
            <h1>Discover Your Next<br><span class="gradient-text">Great Adventure</span></h1>
            <p>Explore the digital library. Read anywhere, anytime.</p>
            <div class="hero-meta">
              <div class="meta-chip"><strong>500+</strong><span>Books</span></div>
              <div class="meta-chip"><strong>50k+</strong><span>Readers</span></div>
              <div class="meta-chip"><strong>100+</strong><span>Authors</span></div>
            </div>
          </div>
          <div class="hero-visual" aria-hidden="true">
            <div class="floating-book book-1"><i class="fas fa-book"></i></div>
            <div class="floating-book book-2"><i class="fas fa-book"></i></div>
            <div class="floating-book book-3"><i class="fas fa-book"></i></div>
          </div>
        </div>
      </section>

      <section id="featured" class="section">
        <div class="container">
          <h2 class="section-title"><i class="fas fa-star"></i> Featured Books</h2>
          <div id="featured-carousel"></div>
        </div>
      </section>

      <section id="new-releases" class="section">
        <div class="container">
          <h2 class="section-title"><i class="fas fa-sparkles"></i> New Releases</h2>
          <div class="cards" id="new-releases-grid"></div>
        </div>
      </section>

      <section id="all-books-section" class="section">
        <div class="container">
          <h2 class="section-title"><i class="fas fa-book"></i> All Books</h2>
          <div class="cards" id="all-books-grid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>littleBraynBookSite © 2024. All rights reserved.</p>
      </div>
    </footer>

    <!-- Book detail page -->
    <section id="book-detail-page" class="page">
      <div class="container book-detail">
        <button class="back-button" onclick="showPage('landing-page')">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <div class="book-detail-content">
          <div class="book-cover-large" id="detail-cover-wrap">
            <img id="detail-cover" src="" alt="" />
          </div>
          <div class="book-info">
            <h1 id="detail-title"></h1>
            <p id="detail-author" class="author"></p>
            <div class="book-meta" id="detail-meta">
              <span id="detail-genre" class="pill"></span>
              <span id="detail-pages" class="pill"></span>
            </div>
            <p id="detail-description" class="description"></p>
            <div class="book-actions">
              <button class="btn btn-primary" id="btn-read-swipe" onclick="openExternalReader()">
                <i class="fas fa-book-open"></i> Read Now
              </button>
              <button class="btn btn-download" onclick="downloadBook()">
                <i class="fas fa-download"></i> Download PDF
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Category page -->
    <section id="category-index-page" class="page">
      <div class="section">
        <div class="container">
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <button class="back-button" onclick="showPage('landing-page')">
              <i class="fas fa-arrow-left"></i> Back
            </button>
            <h2 class="section-title" style="margin-top:0"><i class="fas fa-tag"></i> <span id="category-index-title">Category</span></h2>
          </div>
          <div class="cards" id="category-index-grid"></div>
        </div>
      </div>
    </section>

    <!-- Reader -->
    <div id="reader-modal" class="modal">
      <div class="reader-container" id="reader-container">
        <div class="reader-controls">
          <button onclick="closeReader()" class="icon-btn" title="Close"><i class="fas fa-times"></i></button>
          <button onclick="toggleFullscreen()" class="icon-btn" title="Fullscreen"><i class="fas fa-expand"></i></button>
          <button onclick="toggleDayNight()" class="icon-btn" title="Day/Night"><i class="fas fa-moon"></i></button>
          <button onclick="prevPage()" class="icon-btn" title="Previous"><i class="fas fa-chevron-left"></i></button>
          <span class="page-indicator" id="page-indicator">Page 1 of 100</span>
          <button onclick="nextPage()" class="icon-btn" title="Next"><i class="fas fa-chevron-right"></i></button>
          <div class="font-controls">
            <button onclick="changeFont(-1)">A-</button>
            <button onclick="changeFont(1)">A+</button>
          </div>
        </div>
        <div class="reader-book-header">
          <span class="reader-logo"><span class="brand-badge"><i class="fas fa-book-open"></i></span> littleBrayn</span>
        </div>
        <div class="reader-content" id="reader-content"></div>
        <div class="reader-progress">
          <div class="progress-track"><div class="progress-filled" id="progress-filled"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    window.pdfjsLib = window.pdfjsLib || {};
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <script src="/public/js/app.js"></script>
</body>
</html>
