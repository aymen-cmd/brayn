<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Reading - littleBrayn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: background-color .25s ease, color .25s ease; }
    .light { --top-bg: linear-gradient(135deg, #f8fafc, #e2e8f0); --top-border: #e2e8f0; --ink: #0f172a; --muted: #475569; --page-bg: #f1f5f9; --paper: #ffffff; --shadow: rgba(15,23,42,0.25); }
    .dark { --top-bg: linear-gradient(135deg, #000000, #000000); --top-border: #111111; --ink: #ffffff; --muted: #a1a1aa; --page-bg: #000000; --paper: #050505; --shadow: rgba(0,0,0,0.6); }
    body { background: var(--page-bg); color: var(--ink); }

    #progress-bar { position: fixed; top: 3px; left: 0; height: 3px; background: linear-gradient(90deg,#3b82f6,#8b5cf6); z-index: 1001; transition: width .25s ease; width: 0%; }
    .top-bar { position: fixed; left: 0; right: 0; height: 56px; padding: 0 14px; height: calc(56px + max(0px, env(safe-area-inset-top))); z-index: 1000; box-shadow: 0 2px 12px var(--shadow); border-bottom: 1px solid var(--top-border); background: var(--top-bg); display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(12px); transition: transform .25s ease, opacity .25s ease; padding-top: max(0px, env(safe-area-inset-top)); }
    .top-bar.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    .logo { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 16px; font-weight: 800; letter-spacing: 0.3px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 6px 18px rgba(59,130,246,0.35); }
    .page-info { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
    .top-actions { display: inline-flex; gap: 10px; }
    .icon-btn { background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid var(--top-border); width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; backdrop-filter: blur(8px); transition: transform .15s ease, background .15s ease; }
    .icon-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
    .icon-btn:active { transform: translateY(0); }

    .book-container { position: fixed; top: calc(3px + 56px + max(0px, env(safe-area-inset-top))); left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: var(--page-bg); overflow: hidden; }
    .book-page { position: relative; width: 100%; max-width: 820px; max-height: calc(100vh - 3px - 56px); background: var(--paper); box-shadow: 0 30px 90px var(--shadow); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100%; box-sizing: border-box; }
    .book-page canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .loading { position: fixed; top: calc(3px + 56px + max(0px, env(safe-area-inset-top))); left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; flex-direction: column; gap: 18px; background: var(--page-bg); }
    .spinner { width: 44px; height: 44px; border: 3px solid rgba(0,0,0,0.08); border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #swipe-hint { position: fixed; top: calc(3px + 56px + 16px); bottom: calc(56px + max(0px, env(safe-area-inset-bottom)) + 24px); left: 10%; right: 10%; display: flex; align-items: center; justify-content: space-between; z-index: 800; pointer-events: none; opacity: .9; transition: opacity .4s ease; }
    #swipe-hint.hidden { opacity: 0; }
    .hint-pill { background: rgba(0,0,0,0.45); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(8px); box-shadow: 0 10px 20px rgba(0,0,0,0.35); animation: hintPulse 1.8s infinite ease-in-out; }
    @keyframes hintPulse { 0%,100% { transform: translateX(0); opacity: .7; } 50% { transform: translateX(6px); opacity: 1; } }
    #status-bar { position: fixed; left: 0; right: 0; bottom: calc(56px + max(0px, env(safe-area-inset-bottom)) + 4px); text-align: center; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.2px; z-index: 900; pointer-events: none; opacity: .75; transition: opacity .25s ease; }
    @media (max-width: 600px) {
      .logo span { display: none; }
      .book-page { max-width: 100%; border-radius: 0; }
    }
    .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; padding: 0 14px; height: calc(56px + max(0px, env(safe-area-inset-bottom))); z-index: 1000; box-shadow: 0 -2px 16px var(--shadow); border-top: 1px solid var(--top-border); background: var(--top-bg); display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(12px); transition: transform .25s ease, opacity .25s ease; }
    .bottom-bar.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }
    .bottom-actions { display: inline-flex; gap: 10px; }
    .page-info-bottom { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
  </style>
</head>
<body class="light">
  <div id="progress-bar"></div>
  <div class="top-bar" id="top-bar">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-book-open"></i></div>
      <span>littleBrayn</span>
    </div>
    <div class="page-info" id="page-info">Page 1 of 1</div>
    <div class="top-actions">
      <button class="icon-btn" id="theme-btn" title="Dark/Light"><i class="fas fa-moon"></i></button>
      <button class="icon-btn" id="fullscreen-btn" title="Fullscreen"><i class="fas fa-expand"></i></button>
      <button class="icon-btn" onclick="location.href='/'" title="Close"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <div class="book-container">
    <div id="book-content" class="book-page">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading book...</div>
      </div>
    </div>
  </div>

  <div id="swipe-hint">
    <div class="hint-pill"><i class="fas fa-chevron-left"></i></div>
    <div class="hint-pill"><i class="fas fa-chevron-right"></i></div>
  </div>

  <div class="bottom-bar" id="bottom-bar">
    <div class="bottom-actions">
      <button class="icon-btn" id="prev-bottom" title="Previous"><i class="fas fa-chevron-left"></i></button>
      <button class="icon-btn" id="next-bottom" title="Next"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="page-info-bottom" id="page-info-bottom">Page 1 of 1</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const params = new URLSearchParams(location.search);
    const filePath = decodeURIComponent(params.get('file') || '');
    const bookTitle = decodeURIComponent(params.get('title') || 'Book');
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    const storageKey = `reader:${btoa(filePath).replace(/[^a-zA-Z0-9_-]/g, '')}`;
    const savedPage = Number(localStorage.getItem(storageKey) || 0);
    if (savedPage > 0) currentPage = savedPage;
    const renderedPages = new Map();
    const renderedScales = new Map();
    let currentScale = 2;
    const swipeState = { startX: 0, startY: 0, active: false, direction: null };
    const renderQueue = [];
    let rendering = false;
    const MAX_CANVAS_CACHE = 12;
    const PREFETCH_RANGE = 1;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) renderedScales.clear();
    });

    document.title = `Reading - ${bookTitle} - littleBrayn`;

    const progressBar = document.getElementById('progress-bar');
    const pageInfo = document.getElementById('page-info');
    const pageInfoBottom = document.getElementById('page-info-bottom');
    const topBar = document.getElementById('top-bar');
    const bottomBar = document.getElementById('bottom-bar');
    const prevBottom = document.getElementById('prev-bottom');
    const nextBottom = document.getElementById('next-bottom');
    function hideBarsSoon(delay = 3000) {
      clearTimeout(hideBarsSoon._t);
      topBar.classList.remove('hidden');
      bottomBar.classList.remove('hidden');
      hideBarsSoon._t = setTimeout(() => { topBar.classList.add('hidden'); bottomBar.classList.add('hidden'); }, delay);
    }
    function showBarsBriefly(delay = 2000) {
      topBar.classList.remove('hidden');
      bottomBar.classList.remove('hidden');
      hideBarsSoon(delay);
    }

    function updateStatus() {
      if (!totalPages || !pdfDoc) return;
      const estPagesLeft = totalPages - currentPage + 1;
      const label = `Page ${currentPage} of ${totalPages}`;
      if (pageInfo) pageInfo.textContent = label;
      if (pageInfoBottom) pageInfoBottom.textContent = label;
      const progress = totalPages > 0 ? (currentPage / totalPages) * 100 : 0;
      if (progressBar) progressBar.style.width = `${progress}%`;
    }

    async function loadPDF() {
      if (!filePath) {
        document.getElementById('book-content').innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink)">No file specified</div>';
        return;
      }
      try {
        const loadingTask = pdfjsLib.getDocument(filePath);
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        pageCanvases = {};
        const firstPage = await pdfDoc.getPage(1);
        const rawViewport = firstPage.getViewport({ scale: 1 });
        const maxWidth = Math.min(820, window.innerWidth);
        const maxHeight = window.innerHeight - 3 - 56 - 16;
        const scaleByWidth = Math.max(1.4, Math.min(2.8, maxWidth / rawViewport.width));
        const scaleByHeight = Math.max(1.4, Math.min(2.8, maxHeight / rawViewport.height));
        const baseScale = Math.min(scaleByWidth, scaleByHeight);
        currentScale = baseScale;
        const firstViewport = firstPage.getViewport({ scale: baseScale });
        const loadingEl = document.getElementById('loading');
        try {
          const testCanvas = document.createElement('canvas');
          const testCtx = testCanvas.getContext('2d');
          await firstPage.render({ canvasContext: testCtx, viewport: firstViewport }).promise;
        } catch (firstPageErr) {
          throw new Error('Unable to render the first page of this PDF.');
        }

        wireControls();
        updateStatus();
        await showPage(currentPage || 1);
        showBarsBriefly(2500);
        setTimeout(() => { if (swipeHint) swipeHint.classList.add('hidden'); }, 4000);
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        const loadingEl = document.getElementById('loading');
        if (loadingEl) {
          const existing = loadingEl.querySelector('div');
          const label = existing || document.createElement('div');
          label.textContent = `Error loading PDF: ${msg}`;
          if (!existing) loadingEl.appendChild(label);
          const btn = document.createElement('button');
          btn.id = 'retry-pdf';
          btn.textContent = 'Reload';
          btn.style.cssText = 'margin-top:14px;padding:10px 16px;border-radius:12px;border:1px solid var(--top-border,#e2e8f0);background:var(--paper,#fff);color:var(--ink)';
          loadingEl.appendChild(btn);
          const retryBtn = document.getElementById('retry-pdf');
          if (retryBtn) retryBtn.onclick = () => loadPDF();
        }
      }
    }

    function clampPage(n) {
      return Math.max(1, Math.min(n, totalPages || 1));
    }
    async function showPage(pageNum) {
      currentPage = clampPage(pageNum);
      try { localStorage.setItem(storageKey, String(currentPage)); } catch (e) {}
      const container = document.getElementById('book-content');
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.style.display = 'flex';
      const existing = container ? container.querySelector('canvas.page-canvas') : null;
      if (existing) existing.remove();
      if (!pageCanvases[currentPage]) {
        try {
          pageCanvases[currentPage] = await renderPage(currentPage, currentScale);
          trimCanvasCache();
        } catch (err) {
          console.error('showPage render failed', err);
          if (loadingEl) {
            const label = loadingEl.querySelector('div');
            if (label) label.textContent = 'Error loading page ' + currentPage + ': ' + (err && err.message ? err.message : String(err));
          }
          return;
        }
      }
      if (loadingEl) loadingEl.style.display = 'none';
      const canvas = pageCanvases[currentPage];
      if (canvas) {
        canvas.classList.add('page-canvas');
        container && container.appendChild(canvas);
      }
      updateStatus();
    }
    async function renderPage(pageNum, scale) {
      scale = scale || currentScale;
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
      return canvas;
    }
    function trimCanvasCache() {
      const keys = Object.keys(pageCanvases);
      if (keys.length > MAX_CANVAS_CACHE) {
        const keep = new Set([String(currentPage)]);
        for (let i = 0; i < keys.length && pageCanvases[keys[i]]; i++) keep.add(keys[i]);
        for (const key of keys) if (!keep.has(key)) delete pageCanvases[key];
      }
    }
    function prevPage() { if (currentPage > 1) { showPage(currentPage - 1); } }
    function nextPage() { if (currentPage < totalPages) { showPage(currentPage + 1); } }

    function toggleTheme() {
      const body = document.body;
      const next = body.classList.contains('light') ? 'dark' : 'light';
      body.classList.remove('light', 'dark');
      body.classList.add(next);
      document.getElementById('theme-btn').innerHTML = next === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        document.getElementById('fullscreen-btn').innerHTML = '<i class="fas fa-compress"></i>';
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        document.getElementById('fullscreen-btn').innerHTML = '<i class="fas fa-expand"></i>';
      }
    }

    function wireControls() {
      document.getElementById('theme-btn').onclick = toggleTheme;
      document.getElementById('fullscreen-btn').onclick = toggleFullscreen;
      const prevB = document.getElementById('prev-bottom');
      const nextB = document.getElementById('next-bottom');
      if (prevB) prevB.onclick = (e) => { e.stopPropagation(); prevPage(); };
      if (nextB) nextB.onclick = (e) => { e.stopPropagation(); nextPage(); };
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('.icon-btn') || e.target.closest('.top-actions')) return;
      if (swipeHint && !swipeHint.classList.contains('hidden')) { swipeHint.classList.add('hidden'); return; }
      showBarsBriefly();
    }, true);
    document.addEventListener('click', () => { hideBarsSoon(); }, true);
    document.addEventListener('touchstart', () => showBarsBriefly(), { passive: true });

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        swipeState.startX = e.touches[0].clientX;
        swipeState.startY = e.touches[0].clientY;
        swipeState.active = false;
        swipeState.direction = null;
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1 || swipeState.direction) return;
      const dx = Math.abs(swipeState.startX - e.touches[0].clientX);
      const dy = Math.abs(swipeState.startY - e.touches[0].clientY);
      if (Math.max(dx, dy) > 20) {
        swipeState.active = true;
        swipeState.direction = dx > dy ? 'h' : 'v';
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!swipeState.active || swipeState.direction !== 'h') return;
      const endX = e.changedTouches[0].clientX;
      const diff = swipeState.startX - endX;
      if (Math.abs(diff) > 30) diff > 0 ? nextPage() : prevPage();
      swipeState.active = false;
      swipeState.direction = null;
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'Escape') { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else if (history.length > 1) history.back(); }
    });

    loadPDF();
  </script>
</body>
</html>
