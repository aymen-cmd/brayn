<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - littleBraynBookSite</title>
  <link rel="stylesheet" href="/public/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(400px 300px at 10% -20%, rgba(232,168,124,0.18), transparent),
        radial-gradient(500px 300px at 110% 110%, rgba(56,91,160,0.15), transparent),
        linear-gradient(180deg, #ffffff, #f7fbff);
    }
    .login-card {
      width: min(420px, 96vw);
      background: rgba(255,255,255,0.75);
      border: 1px solid #e6e8f1;
      box-shadow: 0 24px 60px rgba(30, 42, 80, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 24px;
    }
    .login-card h1 { font-family: "Playfair Display", Georgia, serif; color: #1a2a4a; }
    .form { display: grid; gap: 10px; margin-top: 12px; }
    .form input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e6e8f1;
      background: #ffffff;
    }
    .form button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 0;
      background: linear-gradient(135deg, #1a2a4a, #385ba0);
      color: white;
      font-weight: 700;
    }
    .login-hint { color: #6b7691; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>littleBrayn Admin</h1>
      <p class="login-hint">Sign in to manage the library.</p>
      <form class="form" onsubmit="doLogin(event)">
        <input name="username" placeholder="Username" required autocomplete="username" />
        <input name="password" type="password" placeholder="Password" required autocomplete="current-password" />
        <button type="submit"><i class="fas fa-arrow-right"></i> Login</button>
      </form>
      <p id="login-error" style="color:#c0392b;font-size:13px;margin-top:8px;display:none"></p>
    </div>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const data = new FormData(e.target);
      const username = data.get('username');
      const password = data.get('password');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const json = await res.json();
        if (!res.ok) {
          const err = document.getElementById('login-error');
          err.textContent = json.error || 'Login failed';
          err.style.display = 'block';
          return;
        }
        location.replace('/admin/dashboard');
      } catch (err) {
        document.getElementById('login-error').textContent = 'Network error';
        document.getElementById('login-error').style.display = 'block';
      }
    }

    (async () => {
      if (history.length > 1) {
        try { history.replaceState(null, '', '/admin/login'); } catch (e) {}
      }

      (async () => {
        try {
          const res = await fetch('/api/auth/check');
          const json = await res.json();
          if (json.isAdmin) location.replace('/admin/dashboard');
        } catch (e) {}
      })();
    })();
  </script>
</body>
</html>
